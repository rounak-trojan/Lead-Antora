{% extends 'base.html' %}
{% block body %}
<div class="card auth">
  <h1>{{ title }}</h1>
  <p>{{ msg }}</p>
  {% if user %}
  <a class="btn primary" href="{{ url_for('dashboard') }}">Go to dashboard</a>
  {% else %}
  <a class="btn primary" href="{{ url_for('landing') }}">Go to home</a>
  <a class="btn" href="{{ url_for('login') }}">Login</a>
  {% endif %}
</div>
{% endblock %}
