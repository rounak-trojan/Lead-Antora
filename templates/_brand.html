{% macro logo(size=28, gid='lag') %}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" aria-hidden="true" class="logo">
  <defs><linearGradient id="{{ gid }}" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#0d9488"/></linearGradient></defs>
  <rect width="32" height="32" rx="9" fill="url(#{{ gid }})"/>
  <path d="M9 23.5 16 8.5l7 15" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12.3 18h7.4" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="16" cy="8.5" r="2.2" fill="#fff"/>
</svg>
{% endmacro %}
